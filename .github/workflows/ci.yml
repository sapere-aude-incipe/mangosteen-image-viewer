name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Mangosteen.slnx --locked-mode

      - name: Build
        run: dotnet build Mangosteen.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Mangosteen.slnx --configuration Release --no-build --collect:"Code Coverage;Format=cobertura" --results-directory TestResults

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mangosteen-coverage-${{ github.run_id }}
          path: TestResults/**/*.cobertura.xml
          if-no-files-found: error
